name: release

# A tag push builds every asset, publishes the release once all of them exist,
# and repoints the Homebrew cask. workflow_dispatch builds the same assets and
# stops there -- the point of running it by hand is finding out whether they
# build. A release made in the web UI creates its tag through the API, which
# raises no push event, so tags have to be pushed with git (dev/release.sh).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Before any build, so a tag that disagrees with Cargo.toml fails in
      # seconds instead of after every asset has been built under the wrong
      # version.
      - if: github.event_name == 'push'
        run: |
          VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "tag $TAG does not match Cargo.toml version $VERSION" >&2
            exit 1
          fi
        env:
          TAG: ${{ github.ref_name }}

  linux:
    needs: version
    strategy:
      matrix:
        # 22.04, never ubuntu-latest: glibc is forward-compatible only, so a
        # binary linked against a newer runner's glibc will not start on Ubuntu
        # 22.04 or on Debian stable. The oldest runner we build on is the
        # oldest system the release runs on.
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # The same list the README tells a Linux user to install before building
      # from source. If CI needs something more, the README is wrong too.
      - run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake \
            libfontconfig-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libdbus-1-dev

      - run: dev/package-linux.sh

      # Second, not instead: the tarball installs a desktop entry and icons,
      # the AppImage is one file that runs without installing anything, and
      # the release carries both. Both come off the same `cargo build
      # --release`, so this one is the packaging step alone.
      - run: dev/package-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.runner }}
          path: |
            target/linux/dbdelve-*.tar.gz
            target/linux/dbdelve-*.AppImage
          if-no-files-found: error

  macos:
    needs: version
    # arm64, which is all the cask installs on.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Ad-hoc, deliberately: a Developer ID is the only identity Gatekeeper
      # would trust, and a signature from an issuer the user does not trust
      # reads worse than an anonymous one. The price is that the hash moves
      # every release, so the Keychain asks once more after each update.
      - run: dev/bundle.sh
        env:
          DBDELVE_CHANNEL: release
          DBDELVE_SIGN_ID: "-"

      # A symlink beside the app is the whole of the drag-to-install convention.
      - run: |
          VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          mkdir -p target/dmg
          cp -R target/DBDelve.app target/dmg/
          ln -s /Applications target/dmg/Applications
          hdiutil create -volname "DBDelve $VERSION" -srcfolder target/dmg \
            -ov -format UDZO "target/DBDelve-$VERSION.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: target/DBDelve-*.dmg
          if-no-files-found: error

  release:
    needs: [linux, macos]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      # Every file the release is supposed to carry is named here, so a build
      # that quietly lost one fails before anything goes public rather than
      # publishing a release that is missing it.
      - run: |
          VERSION="${TAG#v}"
          for ASSET in "DBDelve-$VERSION.dmg" \
            "dbdelve-$VERSION-linux-x86_64.tar.gz" "dbdelve-$VERSION-x86_64.AppImage" \
            "dbdelve-$VERSION-linux-aarch64.tar.gz" "dbdelve-$VERSION-aarch64.AppImage"; do
            if [[ ! -f "assets/$ASSET" ]]; then
              echo "no $ASSET among the built assets" >&2
              ls assets >&2
              exit 1
            fi
          done
          PRERELEASE=()
          [[ "$TAG" == *-* ]] && PRERELEASE=(--prerelease)
          gh release create "$TAG" assets/* --title "DBDelve $VERSION" \
            --generate-notes --verify-tag "${PRERELEASE[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}

  cask:
    needs: release
    # A pre-release is for testing the pipeline, and Homebrew users would get it
    # as an ordinary update.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos

      # TAP_TOKEN is a fine-grained PAT with contents: write on the tap alone.
      # github.token cannot push to another repository.
      - uses: actions/checkout@v4
        with:
          repository: ShayanAbbas1/homebrew-dbdelve
          token: ${{ secrets.TAP_TOKEN }}
          path: tap

      - run: |
          VERSION="${TAG#v}"
          SHA="$(sha256sum "DBDelve-$VERSION.dmg" | cut -d' ' -f1)"
          mkdir -p tap/Casks
          # Rewritten whole rather than patched in place: two substitutions that
          # have to agree are two chances for the version and the checksum to
          # drift apart.
          cat > tap/Casks/dbdelve.rb <<CASK
          cask "dbdelve" do
            version "$VERSION"
            sha256 "$SHA"

            url "https://github.com/ShayanAbbas1/dbdelve/releases/download/v#{version}/DBDelve-#{version}.dmg"
            name "DBDelve"
            desc "Native SQL client"
            homepage "https://github.com/ShayanAbbas1/dbdelve"

            depends_on arch: :arm64
            depends_on macos: :monterey

            app "DBDelve.app"

            # Lowercase: the app writes "dbdelve", and a zap spelled any other way
            # silently removes nothing. Saved passwords live in the Keychain, which zap
            # cannot reach at all.
            zap trash: "~/Library/Application Support/dbdelve"
          end
          CASK
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/dbdelve.rb
          git commit -m "DBDelve $VERSION"
          git push
        env:
          TAG: ${{ github.ref_name }}
