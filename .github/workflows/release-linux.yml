name: release-linux

# The tag push is the only trigger that matters: dev/release.sh now pushes the
# tag with git before it opens the draft release, so the push event always
# fires. `release: published` is deliberately absent -- the driver publishes the
# release itself once this run's tarballs are attached, and that would fire a
# second, pointless build of the same tag. A release made by hand in the web UI
# creates its tag through the API and so raises no push event; that one needs
# either a tag pushed with git first or a workflow_dispatch and a manual upload.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tarball:
    strategy:
      matrix:
        # 22.04, never ubuntu-latest: glibc is forward-compatible only, so a
        # binary linked against a newer runner's glibc will not start on Ubuntu
        # 22.04 or on Debian stable. The oldest runner we build on is the
        # oldest system the release runs on.
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # The same list the README tells a Linux user to install before building
      # from source. If CI needs something more, the README is wrong too.
      - run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake \
            libfontconfig-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libdbus-1-dev

      - run: dev/package-linux.sh

      # Second, not instead: the tarball installs a desktop entry and icons,
      # the AppImage is one file that runs without installing anything, and
      # the release carries both. Both come off the same `cargo build
      # --release`, so this one is the packaging step alone.
      - run: dev/package-appimage.sh

      # workflow_dispatch has no release to attach to, so it stops at building
      # -- the point of running it by hand is finding out whether it builds.
      # Every other run is a tag push, where `github.ref_name` is the tag.
      - if: github.event_name != 'workflow_dispatch'
        run: |
          # The tag lands before dev/release.sh has created the draft release,
          # so this job can get here first. It waits for the release rather
          # than creating one: a release made here would be a second release on
          # the same tag, without the DMG and without the notes.
          for _ in $(seq 24); do
            gh release view "$TAG" >/dev/null 2>&1 && break
            sleep 5
          done
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "no release for $TAG after two minutes -- nothing to upload to" >&2
            exit 1
          fi
          gh release upload "$TAG" \
            target/linux/dbdelve-*.tar.gz target/linux/dbdelve-*.AppImage \
            --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
