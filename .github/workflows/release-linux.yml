name: release-linux

# Both triggers on purpose. dev/release.sh cuts the macOS release with
# `gh release create`, which makes the tag through the API -- and a tag created
# that way does not reliably raise a push event. `release: published` is the
# one that always fires for it; the tag push covers a tag pushed by hand.
# Whichever arrives first uploads, and --clobber makes the second harmless.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tarball:
    strategy:
      matrix:
        # 22.04, never ubuntu-latest: glibc is forward-compatible only, so a
        # binary linked against a newer runner's glibc will not start on Ubuntu
        # 22.04 or on Debian stable. The oldest runner we build on is the
        # oldest system the release runs on.
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # The same list the README tells a Linux user to install before building
      # from source. If CI needs something more, the README is wrong too.
      - run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake \
            libfontconfig-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libdbus-1-dev

      - run: dev/package-linux.sh

      # workflow_dispatch has no release to attach to, so it stops at building
      # -- the point of running it by hand is finding out whether it builds.
      - if: github.event_name != 'workflow_dispatch'
        run: gh release upload "${TAG}" target/linux/*.tar.gz --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          # `github.ref_name` is the tag on a push and the release's tag on a
          # release event, but only the latter carries `release.tag_name`.
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
